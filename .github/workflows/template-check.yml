name: Template checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Windows 托管环境可能采用 cp1252；中文检查输出统一使用 UTF-8。
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  template:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check template
        run: python scripts/check_project.py
      - name: Test tools
        run: python -m unittest discover -s tests/unit -v
      - name: Compile Python
        run: python -m compileall -q scripts tests
